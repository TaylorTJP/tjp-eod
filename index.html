<!-- TJP End of Day Checklist - working demo
     Single file, no build step. Vanilla JS so it's easy to take into Claude Code.
     DEMO PERSISTENCE: uses the artifact storage API (window.storage) so submissions
     save and the Supervisor view works. In the deployed version you swap the two
     functions marked >>> BACKEND SWAP POINT <<< for calls to your host. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --paper:#ECEAE3; --card:#FFFFFF;
    --ink:#1C1F22; --ink-soft:#5C616A; --ink-faint:#8A8F97;
    --line:#DCD8CE; --line-soft:#ECE9E1;
    --green:#1C7A4B; --green-soft:#E7F1EB; --green-line:#BFE0CC;
    --amber:#B86C12; --amber-soft:#FAEEDB; --amber-line:#EBCB97;
    --band:#22282E; --radius:11px; --tap:48px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto;padding:0 0 130px}
  .wrap.super{max-width:760px}

  /* docket header */
  .band{background:var(--band);color:#fff;padding:18px 20px 16px}
  .band-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .mark{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;letter-spacing:.04em;line-height:1;text-transform:uppercase}
  .mark small{display:block;font-size:11px;font-weight:600;letter-spacing:.22em;color:#A9B0B8;margin-top:5px}
  .docket{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#A9B0B8;text-align:right;line-height:1.6;white-space:nowrap}
  .docket b{color:#fff;font-weight:500}

  .toggle{display:flex;background:#2E353C;border-radius:9px;padding:3px;margin-top:16px}
  .toggle button{flex:1;appearance:none;border:0;cursor:pointer;background:transparent;color:#AEB4BC;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:9px 6px;border-radius:7px}
  .toggle button.on{background:var(--paper);color:var(--ink)}

  .coverage{padding:0 20px;background:var(--band)}
  .coverage-inner{background:#3A424A;height:7px;border-radius:5px;overflow:hidden;transform:translateY(11px)}
  .coverage-fill{height:100%;width:0;background:linear-gradient(90deg,var(--green) 0%,#2FA268 92%,rgba(47,162,104,.35) 100%);border-radius:5px;transition:width .35s ease}

  .pad{padding:24px 16px 0}
  .sect{margin-bottom:22px}
  .eyebrow{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 9px 2px;display:flex;align-items:center;gap:8px}
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}

  .field{margin-bottom:12px}
  label.lab{display:block;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin:0 0 6px 2px}
  input[type=text],input[type=time],input[type=number],textarea,select{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:13px;outline:none}
  textarea{min-height:70px;resize:vertical;line-height:1.4}
  input:focus,textarea:focus,select:focus{border-color:var(--band);box-shadow:0 0 0 3px rgba(34,40,46,.12)}
  .two{display:flex;gap:10px}.two>div{flex:1}
  .hours{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);margin:7px 2px 0}
  .hint{font-size:12.5px;color:var(--amber);margin:7px 2px 0}

  /* worker picker by role */
  .who-role{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin:13px 2px 7px}
  .who-role:first-child{margin-top:0}
  .who{display:flex;flex-wrap:wrap;gap:8px}
  .who button{appearance:none;cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;min-height:var(--tap);font-family:inherit;font-size:15px;font-weight:600;color:var(--ink)}
  .who button.on{background:var(--band);border-color:var(--band);color:#fff}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{appearance:none;cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:11px 13px;min-height:var(--tap);font-family:inherit;font-size:14.5px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:8px}
  .chip .box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
  .chip.on{background:var(--green-soft);border-color:var(--green-line);color:#13502F}
  .chip.on .box{background:var(--green);border-color:var(--green)}
  .chip.on .box::after{content:"";width:5px;height:9px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(40deg) translateY(-1px)}

  .tick{width:100%;appearance:none;cursor:pointer;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;min-height:var(--tap);display:flex;align-items:center;gap:13px;margin-bottom:9px;font-family:inherit;font-size:15.5px;font-weight:500;color:var(--ink)}
  .tick .box{width:23px;height:23px;border-radius:6px;border:1.8px solid var(--line);flex:none;display:grid;place-items:center}
  .tick.on{background:var(--green-soft);border-color:var(--green-line)}
  .tick.on .box{background:var(--green);border-color:var(--green)}
  .tick.on .box::after{content:"";width:6px;height:11px;border:2.4px solid #fff;border-top:0;border-left:0;transform:rotate(40deg) translateY(-1px)}
  .tick.primary{font-size:18px;font-weight:700;padding:17px 16px;min-height:60px;border-width:2px}
  .tick.primary .box{width:27px;height:27px;border-radius:7px}
  .tick.primary .box::after{width:7px;height:13px}

  /* yes / no / n-a question rows */
  .qrow{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:9px}
  .qrow .qt{font-size:15.5px;font-weight:500;color:var(--ink);margin-bottom:10px;line-height:1.35}
  .qrow.primary .qt{font-size:17.5px;font-weight:700}
  .qrow .opts{display:flex;gap:7px}
  .qrow .opts button{flex:1;appearance:none;cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:10px 6px;min-height:var(--tap);font-family:inherit;font-size:14.5px;font-weight:700;color:var(--ink-soft)}
  .qrow .opts button.yes.on{background:var(--green);border-color:var(--green);color:#fff}
  .qrow .opts button.no.on{background:var(--amber);border-color:var(--amber);color:#fff}
  .qrow .opts button.na.on{background:var(--band);border-color:var(--band);color:#fff}
  .qrow.ans-yes{background:var(--green-soft);border-color:var(--green-line)}
  .qrow.ans-note{background:var(--amber-soft);border-color:var(--amber-line)}
  .qrow textarea{margin-top:10px;border-color:var(--amber-line)}

  /* flag rows */
  .flag{background:var(--card);border:1.5px solid var(--line);border-radius:11px;margin-bottom:10px;overflow:hidden}
  .flag-head{width:100%;appearance:none;cursor:pointer;text-align:left;background:transparent;border:0;padding:14px;display:flex;align-items:flex-start;gap:12px;font-family:inherit;color:var(--ink)}
  .flag-q{flex:1}
  .flag-q b{display:block;font-size:15.5px;font-weight:600;line-height:1.3}
  .flag-q span{display:block;font-size:13px;color:var(--ink-faint);margin-top:3px}
  .yn{display:flex;gap:6px;flex:none}
  .yn i{font-style:normal;font-size:13.5px;font-weight:700;letter-spacing:.04em;padding:6px 12px;border-radius:7px;border:1.5px solid var(--line);color:var(--ink-faint)}
  .flag.on{border-color:var(--amber-line);background:var(--amber-soft)}
  .flag.on .yn i.y{background:var(--amber);border-color:var(--amber);color:#fff}
  .flag.off .yn i.n{background:#EBE8E0;border-color:var(--line);color:var(--ink-soft)}
  .flag-body{display:none;padding:0 14px 14px}
  .flag.on .flag-body{display:block}
  .flag-body textarea{border-color:var(--amber-line)}

  .hoursfield{display:flex;align-items:center;gap:11px;margin-bottom:10px}
  .hoursfield label{font-size:13.5px;font-weight:700;color:#7A4A12;flex:1}
  .hoursfield .inp{position:relative;width:118px;flex:none}
  .hoursfield input{width:118px;border-color:var(--amber-line);padding-right:44px;font-family:'IBM Plex Mono',monospace}
  .hoursfield .suf{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-faint);pointer-events:none}

  .callout{display:flex;gap:9px;align-items:flex-start;background:#EAF2EC;border:1.5px solid var(--green-line);border-radius:9px;padding:11px 12px;margin:0 0 11px;font-size:13.5px;color:#13502F;line-height:1.4}
  .callout.late{background:#F3EFE7;border-color:var(--line);color:var(--ink-soft)}
  .callout .clk{font-size:15px;line-height:1.2}
  .callout b{font-weight:700}

  /* job update — the most important bit */
  .sect.jobupdate{border:2px solid var(--green);border-radius:13px;padding:15px 13px 11px;background:#F4F9F5}
  .jobupdate-callout{background:var(--green);color:#fff;border-radius:10px;padding:12px 14px;margin:0 0 12px;font-size:13.5px;line-height:1.5}
  .jobupdate-callout b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
  .sect.jobupdate textarea{min-height:100px;border-color:var(--green-line)}

  .notes-sect textarea{min-height:90px}

  .bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--paper) 72%,rgba(236,234,227,0));padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
  .bar-inner{max-width:480px;margin:0 auto}
  .send{width:100%;appearance:none;border:0;cursor:pointer;background:var(--green);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.05em;text-transform:uppercase;padding:16px;border-radius:12px;min-height:56px;box-shadow:0 6px 18px rgba(28,122,75,.28)}
  .send:disabled{background:#B9C2BB;box-shadow:none;cursor:not-allowed}
  .send-note{text-align:center;font-size:12.5px;color:var(--ink-faint);margin-top:9px}

  .receipt{padding:46px 22px;text-align:center}
  .receipt .ok{width:74px;height:74px;border-radius:50%;background:var(--green-soft);border:2px solid var(--green-line);margin:0 auto 22px;display:grid;place-items:center}
  .receipt .ok::after{content:"";width:18px;height:34px;border:5px solid var(--green);border-top:0;border-left:0;transform:rotate(40deg) translateY(-3px)}
  .receipt h2{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;letter-spacing:.02em;margin:0 0 8px;text-transform:uppercase}
  .receipt p{color:var(--ink-soft);margin:0 0 4px}
  .receipt .ref{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-faint);margin-top:14px}
  .receipt button{margin-top:28px;appearance:none;border:1.5px solid var(--line);cursor:pointer;background:var(--card);color:var(--ink);font-family:inherit;font-size:15px;font-weight:600;padding:13px 22px;border-radius:10px}

  /* supervisor */
  .sup-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 16px 6px}
  .sup-head .ttl{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
  .sup-date{display:flex;align-items:center;gap:6px}
  .sup-date button{appearance:none;border:1.5px solid var(--line);background:var(--card);cursor:pointer;width:36px;height:36px;border-radius:9px;font-size:18px;color:var(--ink);line-height:1}
  .sup-date b{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;letter-spacing:.02em;min-width:140px;text-align:center}
  .tally{display:flex;gap:8px;padding:6px 16px 4px}
  .tally div{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px}
  .tally .n{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1}
  .tally .l{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);margin-top:4px}
  .tally .done .n{color:var(--green)}
  .tally .flagd .n{color:var(--amber)}

  .extras-banner{margin:8px 16px 2px;background:var(--amber-soft);border:1.5px solid var(--amber-line);border-radius:11px;padding:13px 15px;display:flex;align-items:center;gap:13px}
  .extras-banner .big{font-family:'Barlow Condensed',sans-serif;font-size:25px;font-weight:700;color:var(--amber);line-height:1;white-space:nowrap}
  .extras-banner .txt{font-size:13.5px;color:#7A4A12;line-height:1.35}
  .extras-banner .txt b{font-weight:700}

  .sublist{padding:10px 16px 60px}
  .crewcard{background:var(--card);border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .crewcard.pending{border-style:dashed;opacity:.85}
  .cc-head{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer}
  .cc-head.flat{cursor:default}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;background:#CFCBC1}
  .dot.in{background:var(--green)}
  .cc-name{flex:1;font-weight:600;font-size:16px}
  .cc-name small{display:block;font-weight:500;font-size:12px;color:var(--ink-faint);margin-top:1px}
  .cc-tags{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .tag{font-size:11px;font-weight:700;letter-spacing:.03em;padding:4px 8px;border-radius:6px;text-transform:uppercase}
  .tag.amber{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}
  .tag.extra{background:var(--amber);color:#fff}
  .tag.grey{background:#EEEBE3;color:var(--ink-faint)}
  .tag.time{font-family:'IBM Plex Mono',monospace;background:#EEF1F3;color:var(--ink-soft);letter-spacing:0;text-transform:none}
  .cc-body{display:none;border-top:1px solid var(--line-soft);padding:4px 14px 14px}
  .crewcard.open .cc-body{display:block}
  .row{padding:11px 0;border-bottom:1px solid var(--line-soft)}
  .row:last-child{border-bottom:0}
  .row .k{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px;display:flex;align-items:center;gap:7px}
  .row .k .pip{width:7px;height:7px;border-radius:50%;background:var(--amber)}
  .row .v{font-size:14.5px;color:var(--ink);line-height:1.45;white-space:pre-wrap}
  .row.flagrow{background:var(--amber-soft);margin:0 -14px;padding:11px 14px;border-bottom:1px solid #F2E6CF}
  .row.flagrow .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .row.flagrow .cost{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;color:var(--amber);white-space:nowrap}
  .pd{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .pd span{font-size:13px;color:var(--ink-soft);background:#F1EEE6;border-radius:6px;padding:4px 9px}
  .pd span.miss{color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);font-weight:600}
  .pd span.nax{color:var(--ink-soft);background:#EEF1F3;border:1px solid var(--line)}
  .empty{text-align:center;color:var(--ink-faint);padding:34px 20px;font-size:14.5px}
  .demo-note{font-size:11.5px;color:var(--ink-faint);text-align:center;padding:18px 28px 30px;line-height:1.5}

  .guide-toggle{width:100%;appearance:none;border:0;cursor:pointer;background:var(--green);color:#fff;border-radius:11px;padding:16px 18px;margin:0 0 14px;min-height:var(--tap);display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;box-shadow:0 6px 16px rgba(28,122,75,.3)}
  .guide-toggle .gt-label{display:flex;align-items:center;gap:9px}
  .guide-toggle .chev{font-size:15px;transition:transform .2s ease;flex:none}
  .guide-toggle.open .chev{transform:rotate(180deg)}
  .guide{background:var(--card);border:1.5px solid var(--line);border-left:3px solid var(--green);border-radius:9px;padding:13px 14px;margin:-2px 0 14px}
  .guide h4{margin:0 0 9px;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:.01em;color:var(--ink)}
  .guide .step{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.01em;color:var(--ink);margin:14px 0 5px}
  .guide .step:first-child{margin-top:0}
  .guide ol{margin:0;padding-left:20px}
  .guide li{font-size:14px;line-height:1.5;color:var(--ink-soft);margin-bottom:7px}
  .guide li:last-child{margin-bottom:0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  /* photos on touch-ups / finishing surfaces */
  .photostrip{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:-3px 2px 13px}
  .cambtn{appearance:none;cursor:pointer;background:var(--card);border:1.5px dashed var(--line);border-radius:9px;padding:8px 13px;min-height:38px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
  .cambtn:disabled{opacity:.6;cursor:default}
  .photothumb{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1.5px solid var(--line);cursor:pointer;background:#EEE}
  .lightbox{position:fixed;inset:0;z-index:50;background:rgba(20,22,25,.92);display:flex;align-items:center;justify-content:center;padding:22px}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px}
  .lightbox .lb-close{position:fixed;top:14px;right:20px;color:#fff;font-size:34px;line-height:1;font-family:sans-serif;cursor:pointer}
  /* safety tab */
  .safety-meta{background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:14px}
  .safety-meta .code{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-faint)}
  .safety-meta .scope{font-size:14px;color:var(--ink-soft);margin-top:6px;line-height:1.45}
  .hrcw{background:var(--amber-soft);border:1.5px solid var(--amber-line);border-radius:10px;padding:12px 13px;margin-bottom:14px}
  .hrcw h5{margin:0 0 7px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.03em;color:#7A4A12;text-transform:uppercase}
  .hrcw ul{margin:0;padding-left:18px}.hrcw li{font-size:13.5px;color:#7A4A12;margin:3px 0;line-height:1.4}
  .ppe-chips{display:flex;flex-wrap:wrap;gap:7px}
  .ppe-chips span{background:#EEF1F3;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--ink-soft)}
  .saf-card{background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:10px}
  .saf-card .t{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:2px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .saf-card .risk{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
  .risk.High{background:#F7E0DA;color:#9B2D1F}.risk.Medium{background:var(--amber-soft);color:var(--amber)}.risk.Low{background:var(--green-soft);color:var(--green)}
  .saf-card .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:9px 0 3px}
  .saf-card ul{margin:0;padding-left:17px}.saf-card li{font-size:13.5px;color:var(--ink);margin:2px 0;line-height:1.4}
  .saf-card .who{font-size:12px;color:var(--ink-faint);margin-top:9px}
  .saf-note{font-size:12px;color:var(--ink-faint);line-height:1.5;background:#F3EFE7;border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin:6px 0 14px}
  .signon-who{display:flex;flex-wrap:wrap;gap:8px}
  .signon-who button{appearance:none;cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:10px 15px 10px 13px;min-height:var(--tap);font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
  .signon-who button .tk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
  .signon-who button.on{background:var(--green-soft);border-color:var(--green-line);color:#13502F}
  .signon-who button.on .tk{background:var(--green);border-color:var(--green)}
  .signon-who button.on .tk::after{content:"";width:4px;height:8px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(40deg) translateY(-1px)}
</style>

function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function liveBackend(){return /^https?:\/\//.test(API_URL) && !API_URL.includes("PASTE_YOUR");}

// Answers are stored as text in the sheet: "Yes", "No — reason", "N/A — reason".
function packCell(o){
  if(!o||!o.v)return "";
  if(o.v==="yes")return "Yes";
  if(o.v==="na")return "N/A — "+(o.note||"");
  return "No — "+(o.note||"");
}
function parsePack(v){
  if(v===true)return{v:"yes",note:""};
  if(v===false||v==null||v==="")return{v:"no",note:""};
  const s=String(v).trim();
  if(/^(true|yes)$/i.test(s))return{v:"yes",note:""};
  if(/^false$/i.test(s))return{v:"no",note:""};
  if(/^n\/?a/i.test(s))return{v:"na",note:s.replace(/^n\/?a\s*[—–-]*\s*/i,"")};
  if(/^no/i.test(s))return{v:"no",note:s.replace(/^no\s*[—–-]*\s*/i,"")};
  return {v:"no",note:s};
}

// flat row from the sheet -> nested record the Supervisor view reads
function rehydrateRow(r){

async function saveSubmission(rec){
  if(liveBackend()){
    // text/plain dodges the CORS preflight Apps Script can't answer
    await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(flattenRec(rec))});
    return;
  }
  const key="eod:"+rec.date+":"+slug(rec.worker);
  await window.storage.set(key, JSON.stringify(rec), true);
}
async function loadDay(dateStr){
  if(liveBackend()){
    try{
      const res=await fetch(API_URL+"?date="+encodeURIComponent(dateStr));
      const rows=await res.json();
      return Array.isArray(rows)?rows.map(rehydrateRow):[];
    }catch(e){return [];}
  }
  const out=[];
  try{
    const res=await window.storage.list("eod:"+dateStr+":",true);
    const keys=(res&&res.keys)||[];
    for(const k of keys){ try{const g=await window.storage.get(k,true); if(g&&g.value)out.push(JSON.parse(g.value));}catch(e){} }
  }catch(e){}
  return out;
}

    flags:{makegood:{on:false,note:"",hours:"",who:"",materials:"",photo:false},variation:{on:false,note:"",hours:"",who:"",materials:""},holdup:{on:false,note:"",hours:""},materials:{on:false,note:""}},

function isAppr(){return f.worker && roleOf(f.worker)==="Apprentice";}

/* ====================== RENDER ====================== */
function render(){
  const app=$("#app"); app.innerHTML="";
  app.appendChild(header());
  if(view==="crew"){app.appendChild(coverage());app.appendChild(crewForm());app.appendChild(submitBar());}
  else if(view==="touch"){renderTouch(app);}
  else if(view==="safety"){renderSafety(app);}
  else renderSupervisor(app);
  if(lightbox) app.appendChild(lightboxEl());
}

function header(){
  const wrap=el("div","wrap"+(view==="super"?" super":""));
  const band=el("div","band");
  const top=el("div","band-top");
  top.appendChild(el("div","mark","TJP<small>End of day</small>"));
  const dk=el("div","docket");
  dk.innerHTML = view==="crew"
    ? "<b>EOD-"+todayISO().replace(/-/g,"")+(f.worker?("-"+initials(f.worker)):"")+"</b><br>"+prettyDate(todayISO())
    : view==="touch"
    ? "<b>FINISHING STAGES</b><br>"+(touchJob?touchJob:"Pick a job")
    : view==="safety"
    ? "<b>SAFETY — JSA / SWMS</b><br>"+(safetyJob?safetyJob:"Pick a job")
    : "<b>SUPERVISOR</b><br>"+prettyDate(supDate);
  top.appendChild(dk); band.appendChild(top);
  const tg=el("div","toggle");
  const b1=el("button",view==="crew"?"on":"","Crew");
  const b2=el("button",view==="super"?"on":"","Supervisor");
  const b3=el("button",view==="touch"?"on":"","Finishing");
  const b4=el("button",view==="safety"?"on":"","Safety");
  b1.onclick=()=>{view="crew";render();}; b2.onclick=()=>{view="super";render();}; b3.onclick=()=>{view="touch";render();}; b4.onclick=()=>{view="safety";render();};
  tg.appendChild(b1);tg.appendChild(b2);tg.appendChild(b3);tg.appendChild(b4); band.appendChild(tg);
  wrap.appendChild(band); return wrap;
}

function coverage(){const c=el("div","coverage");const inner=el("div","coverage-inner");const fill=el("div","coverage-fill");fill.style.width=progress()+"%";inner.appendChild(fill);c.appendChild(inner);return c;}
function progress(){
  let total=0,done=0;
  total++;if(f.worker)done++;
  total++;if(jobOK())done++;
  total++;if(f.workDone.trim())done++;
  total++;if(f.jobUpdate.trim())done++;
  if(isAppr()){total++;if(ownersWayAnswered())done++;}
  total++;if(Object.values(f.prep).some(Boolean))done++;
  FLAGS.forEach(fl=>{total++;if(flagComplete(fl))done++;});
  PACK_ALL.forEach(p=>{total++;if(packAnswered(p))done++;});
  return Math.round(done/total*100);
}

// Downscale + compress a chosen photo to a JPEG data URL so uploads stay small.
function fileToDataUrl(file,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      const scale=Math.min(1,maxDim/Math.max(w,h));
      w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      try{resolve(cv.toDataURL("image/jpeg",quality));}catch(e){reject(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("bad image"));};
    img.src=url;
  });
}
// Send a photo to the backend, which stores it in Drive and returns a view URL.
async function tuPhoto(job,type,item,by,dataUrl){
  if(!liveBackend())return null;
  try{
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"photo",job:job,type:type,item:item,by:by,dataUrl:dataUrl})});
    const d=await r.json();
    return (d&&d.url)?d.url:null;
  }catch(e){return null;}
}
// Open the camera / photo picker for one touch-up or finishing item.
function pickPhoto(type,item){
  const key=type+"|"+item;
  const inp=document.createElement("input");
  inp.type="file";inp.accept="image/*";inp.setAttribute("capture","environment");
  inp.onchange=async()=>{
    const file=inp.files&&inp.files[0];if(!file)return;
    uploading[key]=true;render();
    let ok=false;
    try{
      const dataUrl=await fileToDataUrl(file,1280,0.72);
      const url=await tuPhoto(touchJob,type,item,touchPerson||"",dataUrl);
      if(url){
        let row=touchData.find(x=>x.type===type&&x.item===item);
        if(!row){row={job:touchJob,type:type,item:item,done:false,done_by:"",done_at:"",supervisor:"",photo:""};touchData.push(row);}
        row.photo=url;ok=true;
      }
    }catch(e){}
    delete uploading[key];render();
    if(!ok)alert("Photo didn't upload — check signal and try again.");
  };
  inp.click();
}
// The little "Add photo" button + thumbnail shown under each item.
function photoStrip(type,item,label){
  if(!PHOTOS_ENABLED) return el("span");
  const noun=label||"photo";
  const key=type+"|"+item;
  const row=touchData.find(x=>x.type===type&&x.item===item);
  const d=el("div","photostrip");
  if(row&&row.photo){
    const th=el("img","photothumb");th.src=row.photo;th.alt=noun;
    th.onclick=()=>{lightbox=row.photo;render();};
    d.appendChild(th);
  }
  const busy=!!uploading[key];
  const cam=el("button","cambtn",busy?"⏳ Uploading…":((row&&row.photo)?("📷 Replace "+noun):("📷 Add "+noun)));
  if(busy)cam.disabled=true;
  cam.onclick=()=>pickPhoto(type,item);
  d.appendChild(cam);
  return d;
}

function renderTouch(app){
  const wrap=el("div","wrap");const pad=el("div","pad");
  // Job picker
  let s=sect("Which job?");
  let fld=el("div","field");
  const sel=el("select");
  sel.appendChild(new Option("Pick a job...",""));
  JOBS.forEach(j=>{const o=new Option(j,j);if(touchJob===j)o.selected=true;sel.appendChild(o);});
  sel.onchange=e=>{touchJob=e.target.value;touchPerson=null;pendingFinish=null;loadTouch();};
  fld.appendChild(sel);s.appendChild(fld);pad.appendChild(s);

  if(!touchJob){
    pad.appendChild(el("div","empty","Pick a job to see its touch-ups and finishing checklist."));
    wrap.appendChild(pad);app.appendChild(wrap);return;
  }
  // Who's checking (optional, records who ticked)
  s=sect("Who's checking (optional)");
  fld=el("div","field");const who=el("div","who");
  CREW.forEach(c=>{const b=el("button",touchPerson===c.name?"on":"",c.name);b.onclick=()=>{touchPerson=(touchPerson===c.name?null:c.name);render();};who.appendChild(b);});
  fld.appendChild(who);s.appendChild(fld);pad.appendChild(s);

  if(tuLoading){pad.appendChild(el("div","empty","Loading the list..."));wrap.appendChild(pad);app.appendChild(wrap);return;}

  // Finishing (supervisor sign-off) — includes the finishing order of
  // operations reference panel at the top, then the surface sign-off ticks.
  s=sect("Finished surfaces — sign-off");
  const otgl=el("button","guide-toggle"+(showOrder?" open":""),"<span class='gt-label'>📋 "+(showOrder?"Hide finishing order":"Finishing order — tap to view")+"</span><span class='chev'>▾</span>");
  otgl.onclick=()=>{showOrder=!showOrder;render();};
  s.appendChild(otgl);
  if(showOrder){
    const g=el("div","guide");
    g.appendChild(el("h4",null,escapeHtml(FINISH_ORDER.header)));
    FINISH_ORDER.steps.forEach(step=>{
      g.appendChild(el("div","step",escapeHtml(step.title)));
      const ol=el("ol");
      step.items.forEach(it=>ol.appendChild(el("li",null,escapeHtml(it))));
      g.appendChild(ol);
    });
    s.appendChild(g);
  }
  FINISH.forEach(stage=>{
    const row=touchData.find(x=>x.type==="finish"&&x.item===stage);
    const done=row&&row.done;
    const t=el("button","tick primary"+(done?" on":""),"<span class='box'></span>"+stage+(done&&row.supervisor?" <small style='color:#13502F;font-weight:600'>✓ "+escapeHtml(row.supervisor)+"</small>":""));
    t.onclick=()=>{ if(done){setFinish(stage,false,"");} else {pendingFinish=stage;otherSup="";render();} };
    s.appendChild(t);
    s.appendChild(photoStrip("finish",stage));
    if(pendingFinish===stage){
      const sign=el("div","callout");sign.style.display="block";
      sign.appendChild(el("div",null,"<b>Signed off — tap your name</b>"));
      const w2=el("div","who");w2.style.marginTop="8px";
      CREW.forEach(c=>{const b=el("button","",c.name);b.onclick=()=>setFinish(stage,true,c.name);w2.appendChild(b);});
      const bo=el("button",otherSup==="__typing__"?"on":"","Other");bo.onclick=()=>{otherSup="__typing__";render();};w2.appendChild(bo);
      sign.appendChild(w2);
      if(otherSup==="__typing__"){
        const oi=el("input");oi.type="text";oi.placeholder="Type your name";oi.style.marginTop="8px";oi.value=otherSupName;oi.oninput=e=>{otherSupName=e.target.value;};
        const ok=el("button","chip","Sign off");ok.style.marginTop="8px";ok.onclick=()=>{if(otherSupName.trim())setFinish(stage,true,otherSupName.trim());};
        sign.appendChild(oi);sign.appendChild(ok);
      }
      s.appendChild(sign);
    }
  });
  pad.appendChild(s);

  // Touch-ups — now below the finishing order + surface sign-off
  s=sect("Touch-ups");
  const items=touchData.filter(x=>x.type==="touchup");
  if(!items.length)s.appendChild(el("div","hint","No touch-ups yet. Add any you spot below."));
  items.forEach(it=>{
    const t=el("button","tick"+(it.done?" on":""),"<span class='box'></span>"+escapeHtml(it.item)+(it.done&&it.done_by?" <small style='color:#8A8F97'>· "+escapeHtml(it.done_by)+"</small>":""));
    t.onclick=()=>toggleTouch(it);s.appendChild(t);
    if(it.done) s.appendChild(photoStrip("touchup",it.item,"after photo"));
  });
  const addWrap=el("div","field");addWrap.style.marginTop="10px";
  const ai=el("input");ai.type="text";ai.placeholder="Add a touch-up you spotted...";ai.value=tuAddText;ai.oninput=e=>{tuAddText=e.target.value;};
  const ab=el("button","chip","+ Add");ab.style.marginTop="8px";ab.onclick=()=>addTouch();
  addWrap.appendChild(ai);addWrap.appendChild(ab);s.appendChild(addWrap);pad.appendChild(s);

  wrap.appendChild(pad);app.appendChild(wrap);
}

/* ====================== SAFETY (JSA / SWMS) ====================== */
// Sign-ons are stored through the existing touch-up backend as type "signon"
// (item encodes work type + worker), so no backend change is needed.
async function loadSafety(){
  if(!safetyJob){safetyData=[];render();return;}
  safetyLoading=true;render();
  const all=await tuLoad(safetyJob);
  safetyData=(all||[]).filter(x=>x.type==="signon"||x.type==="safetynote");
  safetyLoading=false;render();
}
function isDone(v){return v===true||v==="TRUE"||v==="true"||v===1||v==="1";}
function signedOn(worktype,name){
  const item=worktype+" :: "+name;
  return safetyData.some(x=>x.type==="signon"&&x.item===item&&isDone(x.done));
}
async function toggleSignon(worktype,name){
  const item=worktype+" :: "+name;
  let row=safetyData.find(x=>x.type==="signon"&&x.item===item);
  const nowOn=!(row&&isDone(row.done));
  if(!row){row={job:safetyJob,type:"signon",item:item,done:false,done_by:name,done_at:"",supervisor:""};safetyData.push(row);}
  row.done=nowOn;row.done_by=name;
  render();
  await tuSet({job:safetyJob,type:"signon",item:item,done:nowOn,done_by:name});
}
async function saveSafetyNote(key,text){
  let row=safetyData.find(x=>x.type==="safetynote"&&x.item===key);
  if(!row){row={job:safetyJob,type:"safetynote",item:key,done:true,done_by:"",done_at:"",supervisor:text};safetyData.push(row);}
  row.supervisor=text;
  safetyNoteSaving=true;render();
  await tuSet({job:safetyJob,type:"safetynote",item:key,done:true,done_by:"",supervisor:text});
  safetyNoteSaving=false;render();
}

function renderSafety(app){
  const wrap=el("div","wrap");const pad=el("div","pad");
  // Job picker
  let s=sect("Which job?");
  let fld=el("div","field");
  const jsel=el("select");
  jsel.appendChild(new Option("Pick a job...",""));
  JOBS.forEach(j=>{const o=new Option(j,j);if(safetyJob===j)o.selected=true;jsel.appendChild(o);});
  jsel.onchange=e=>{safetyJob=e.target.value;loadSafety();};
  fld.appendChild(jsel);s.appendChild(fld);pad.appendChild(s);

  if(!safetyJob){
    pad.appendChild(el("div","empty","Pick a job to view its safety docs and sign on."));
    wrap.appendChild(pad);app.appendChild(wrap);return;
  }

  // Work-type picker
  const wt=safetyType||SAFETY_TYPES[0];
  s=sect("Type of work");
  fld=el("div","field");
  const tsel=el("select");
  SAFETY_TYPES.forEach(tp=>{const o=new Option(tp,tp);if(wt===tp)o.selected=true;tsel.appendChild(o);});
  tsel.onchange=e=>{safetyType=e.target.value;render();};
  fld.appendChild(tsel);s.appendChild(fld);pad.appendChild(s);

  // JSA vs SWMS picker
  s=sect("View");
  fld=el("div","field");
  const dsel=el("select");
  [["jsa","JSA — Job Safety Analysis"],["swms","SWMS — Safe Work Method Statement"]].forEach(pair=>{const o=new Option(pair[1],pair[0]);if(safetyDoc===pair[0])o.selected=true;dsel.appendChild(o);});
  dsel.onchange=e=>{safetyDoc=e.target.value;render();};
  fld.appendChild(dsel);s.appendChild(fld);pad.appendChild(s);

  const doc=SAFETY[wt]; if(!doc){wrap.appendChild(pad);app.appendChild(wrap);return;}
  const isSwms=(safetyDoc==="swms");

  // Meta
  const meta=el("div","safety-meta");
  meta.appendChild(el("div","code",escapeHtml(doc.code)+" · "+escapeHtml(wt)));
  meta.appendChild(el("div","scope",escapeHtml(doc.scope)));
  pad.appendChild(meta);

  // High-risk construction work (SWMS view only)
  if(isSwms&&doc.hrcw&&doc.hrcw.length){
    const h=el("div","hrcw");
    h.appendChild(el("h5",null,"High-risk construction work — SWMS required"));
    const ul=el("ul");doc.hrcw.forEach(x=>ul.appendChild(el("li",null,escapeHtml(x))));
    h.appendChild(ul);pad.appendChild(h);
  }

  // PPE
  s=sect("PPE required");
  const chips=el("div","ppe-chips");doc.ppe.forEach(p=>chips.appendChild(el("span",null,escapeHtml(p))));
  s.appendChild(chips);pad.appendChild(s);

  // JSA (JSA view only)
  if(!isSwms){
  s=sect("JSA — steps, hazards & controls");
  doc.jsa.forEach((r,i)=>{
    const c=el("div","saf-card");
    c.appendChild(el("div","t","<span>"+(i+1)+". "+escapeHtml(r.step)+"</span>"));
    c.appendChild(el("div","lbl","Hazards"));
    let ul=el("ul");r.hazards.forEach(x=>ul.appendChild(el("li",null,escapeHtml(x))));c.appendChild(ul);
    c.appendChild(el("div","lbl","Controls"));
    ul=el("ul");r.controls.forEach(x=>ul.appendChild(el("li",null,escapeHtml(x))));c.appendChild(ul);
    s.appendChild(c);
  });
  pad.appendChild(s);
  }

  // SWMS (SWMS view only)
  if(isSwms){
  s=sect("SWMS — activities & control measures");
  doc.swms.forEach(r=>{
    const c=el("div","saf-card");
    c.appendChild(el("div","t","<span>"+escapeHtml(r.task)+"</span><span class='risk "+r.risk+"'>"+escapeHtml(r.risk)+"</span>"));
    c.appendChild(el("div","lbl","Hazards"));
    let ul=el("ul");r.hazards.forEach(x=>ul.appendChild(el("li",null,escapeHtml(x))));c.appendChild(ul);
    c.appendChild(el("div","lbl","Control measures"));
    ul=el("ul");r.controls.forEach(x=>ul.appendChild(el("li",null,escapeHtml(x))));c.appendChild(ul);
    c.appendChild(el("div","who","Responsible: "+escapeHtml(r.who)));
    s.appendChild(c);
  });
  pad.appendChild(s);
  }

  pad.appendChild(el("div","saf-note","This is a TJP template SWMS/JSA. Before work starts, check it covers the actual site conditions, add anything specific to this job, and make sure every worker has signed on below. Keep it on site and review it if the work or conditions change."));

  // Notes (per job + work type + JSA/SWMS)
  {
    const nkey=wt+" :: "+safetyDoc+" :: notes";
    const nrow=safetyData.find(x=>x.type==="safetynote"&&x.item===nkey);
    const saved=nrow?(nrow.supervisor||nrow.note||""):"";
    const sn=sect("Notes for this job");
    const nf=el("div","field");
    const ta=el("textarea");ta.value=saved;ta.placeholder="Site-specific notes — extra hazards, controls, access, who to call...";
    nf.appendChild(ta);
    const sb=el("button","chip",safetyNoteSaving?"Saving…":"Save note");if(safetyNoteSaving)sb.disabled=true;sb.style.marginTop="8px";
    sb.onclick=()=>saveSafetyNote(nkey,ta.value);
    nf.appendChild(sb);
    if(nrow&&saved)nf.appendChild(el("div","hint","Saved to the job — visible to Taylor."));
    sn.appendChild(nf);pad.appendChild(sn);
  }

  // Sign-on
  s=sect("Sign on — "+wt);
  if(safetyLoading){s.appendChild(el("div","empty","Loading sign-ons..."));}
  else{
    s.appendChild(el("div","hint","Tap your name to confirm you've read and understood the JSA & SWMS for this job. Tap again to remove."));
    const who=el("div","signon-who");
    CREW.forEach(c=>{
      const on=signedOn(wt,c.name);
      const b=el("button",on?"on":"","<span class='tk'></span>"+escapeHtml(c.name));
      b.onclick=()=>toggleSignon(wt,c.name);
      who.appendChild(b);
    });
    s.appendChild(who);
    const n=CREW.filter(c=>signedOn(wt,c.name)).length;
    s.appendChild(el("div","hint",n+" of "+CREW.length+" signed on for this work type."));
  }
  pad.appendChild(s);

  wrap.appendChild(pad);app.appendChild(wrap);
}

// Pull the live job list from the sheet's Jobs tab (GET with no params returns
// the Jobs column). Falls back to the hardcoded JOBS above if the fetch fails.
async function loadJobs(){
  if(!liveBackend())return;
  // Apps Script can cold-start and fail the first hit; retry so the full
  // list reliably loads instead of falling back to the built-in list.
  for(var attempt=0; attempt<4; attempt++){
    try{
      const res=await fetch(API_URL,{cache:"no-store"});
      const arr=await res.json();
      if(Array.isArray(arr)&&arr.length){JOBS=arr;return;}
    }catch(e){}
    await new Promise(r=>setTimeout(r,1200));
  }
}
render();
loadJobs().then(()=>{ if((view==="crew"&&!f.worker)||(view==="touch"&&!touchJob)||(view==="safety"&&!safetyJob)) render(); });
</script>
